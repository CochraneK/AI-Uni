name: Normalize AI-Uni package lock

on:
  push:
    branches:
      - feat/bjtu-campus-v1
    paths:
      - package.json
      - .github/workflows/normalize-package-lock.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/bjtu-campus-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate package-lock metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit normalized package lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: normalize package lock for AI-Uni [skip ci]"
          git push origin HEAD:feat/bjtu-campus-v1
