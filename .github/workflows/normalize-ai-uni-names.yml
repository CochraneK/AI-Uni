name: Normalize AI-Uni names

on:
  push:
    branches:
      - feat/bjtu-campus-v1
    paths:
      - .github/workflows/normalize-ai-uni-names.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/bjtu-campus-v1

      - name: Normalize known legacy product strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              '/ai-town/assets/': '/ai-uni/assets/',
              'https://github.com/CochraneK/ai-town': 'https://github.com/CochraneK/ai-uni',
              'AI-Uni Campus': 'AI-Uni',
              'AI Town · BJTU Campus': 'AI-Uni',
          }
          targets = [
              Path('data/gentle.js'),
              Path('convex/music.ts'),
              Path('src/components/PixiStaticMap.tsx'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  print(f'normalized {path}')
          PY

          echo 'Remaining product-level legacy matches outside upstream attribution:'
          git grep -n -E '(/ai-town/assets/|CochraneK/ai-town|AI-Uni Campus|AI Town · BJTU Campus)' -- \
            ':(exclude).github/workflows/normalize-ai-uni-names.yml' || true

      - name: Commit normalization
        run: |
          if git diff --quiet -- data/gentle.js convex/music.ts src/components/PixiStaticMap.tsx; then
            echo "No legacy product strings needed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gentle.js convex/music.ts src/components/PixiStaticMap.tsx
          git commit -m "chore: finish AI-Uni naming normalization [skip ci]"
          git push origin HEAD:feat/bjtu-campus-v1
