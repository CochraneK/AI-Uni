name: Build AI-Uni GitHub Pages

on:
  push:
    branches:
      - feat/bjtu-campus-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Convex deployment URL
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "Missing repository variable VITE_CONVEX_URL."
            echo "Create Settings > Secrets and variables > Actions > Variables > VITE_CONVEX_URL with the public Convex deployment URL."
            exit 1
          fi

      - name: Build AI-Uni
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: npm run build

      - name: Keep GitHub Pages from running Jekyll
        run: touch dist/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
